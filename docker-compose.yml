services:
  location_monitor:
    image: cloudflare-monitor-location_monitor:beta-01
    command: python3 cloudflare_monitor.py
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    user: "0:0"
    security_opt:
      - no-new-privileges:true

  incident_monitor:
    image: cloudflare-monitor-incident_monitor:beta-01
    command: python3 incident_monitor.py
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    user: "0:0"
    security_opt:
      - no-new-privileges:true