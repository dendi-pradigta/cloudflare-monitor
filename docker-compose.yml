version: '3.8'

services:
  location-monitor:
    build: .
    command: python3 cloudflare_monitor.py
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  incident-monitor:
    build: .
    command: python3 incident_monitor.py
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    restart: unless-stopped