version: '3.3'

services:
  location-monitor:
    build: .
    command: python3 cloudflare_monitor.py
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    user: "${UID:-0}:${GID:-0}"
    security_opt:
      - no-new-privileges:true

  incident-monitor:
    build: .
    command: python3 incident_monitor.py
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    user: "${UID:-0}:${GID:-0}"
    security_opt:
      - no-new-privileges:true